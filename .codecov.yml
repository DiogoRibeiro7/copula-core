codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "60...90"

  status:
    project:
      default:
        target: 70%
        threshold: 2%
    patch:
      default:
        target: 80%
        threshold: 5%

ignore:
  - "examples/"
  - "benches/"
  - "tests/"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
