name: Documentation improvement
description: Report inaccurate docs or request better examples, guides, or API docs.
title: "docs: "
labels:
  - documentation
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: README still refers to the old crate name in...
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Location
      description: File path, doc page, or section.
      placeholder: README.md, src/lib.rs crate docs, docs.rs page...
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
