version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "type:maintenance"
      - "area:build"
    # No lockfile is committed, so these PRs are requirement bumps outside the
    # current semver range. Keep them ungrouped: several of these crates
    # (`rand`, `nalgebra`, `statrs`) appear in the public API.
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "type:maintenance"
      - "area:ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
