name: Branch Policy

on:
  pull_request:
    branches:
      - main
      - develop

permissions: {}

jobs:
  develop-source-branch:
    if: github.base_ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce feature branch to develop flow
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "main" ] || [ "$HEAD_REF" = "develop" ]; then
            echo "PRs into develop must come from a working branch, not from main or develop."
            echo "Current head branch: $HEAD_REF"
            exit 1
          fi

          echo "Branch policy satisfied: working-branch -> develop"

  main-source-branch:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce develop to main flow
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "PRs into main must come from the develop branch of $BASE_REPO."
            echo "Current head: $HEAD_REPO:$HEAD_REF"
            exit 1
          fi

          echo "Branch policy satisfied: develop -> main"
