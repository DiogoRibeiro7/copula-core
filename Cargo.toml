# Cargo.toml

[package]
name = "copulas"
version = "0.1.0"
edition = "2021"  # Fixed: was "2025"
authors = ["Diogo Ribeiro <your.email@example.com>"]
license = "MIT OR Apache-2.0"
description = "A comprehensive Rust library for copula modeling, estimation, and simulation"
homepage = "https://github.com/diogoribeiro7/copulas-rs"
repository = "https://github.com/diogoribeiro7/copulas-rs"
documentation = "https://docs.rs/copulas"
readme = "README.md"
keywords = ["statistics", "copula", "finance", "risk", "mathematics"]
categories = ["science", "mathematics", "algorithms"]
exclude = [
    "docs/*",
    "scripts/*",
    ".github/*",
    "*.py",
    "*.R"
]

[dependencies]
# Core mathematical operations
nalgebra = { version = "0.32", features = ["serde-serialize"] }
statrs = "0.16"

# Random number generation
rand = "0.8"
rand_distr = "0.4"

# Error handling
thiserror = "1.0"

# Optimization (for parameter estimation)
argmin = { version = "0.8", optional = true }

# Parallel processing
rayon = { version = "1.7", optional = true }

# Serialization support
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# Special functions and numerical methods
libm = "0.2"

[dev-dependencies]
# Testing and benchmarking
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.0"

# Additional test utilities
tempfile = "3.0"
csv = "1.2"

[features]
default = ["std"]

# Standard library support
std = []

# Parameter estimation capabilities
estimation = ["argmin"]

# Parallel processing
parallel = ["rayon"]

# Serialization support
serde = ["dep:serde", "dep:serde_json", "nalgebra/serde-serialize"]

# All features for comprehensive testing
full = ["estimation", "parallel", "serde"]

# Experimental features (unstable API)
experimental = []

[[bench]]
name = "copula_evaluation"
harness = false

[[bench]]
name = "parameter_estimation"
harness = false
required-features = ["estimation"]

[[bench]]
name = "sampling_performance"
harness = false

[[example]]
name = "basic_usage"
required-features = ["std"]

[[example]]
name = "parameter_estimation"
required-features = ["estimation"]

[[example]]
name = "risk_management"
required-features = ["std"]

[package.metadata.docs.rs]
features = ["full"]
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
debug = true
