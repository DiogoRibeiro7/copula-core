# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
yanked = "deny"
# Each ignore needs a reason and should be removed once the upstream path is gone.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; build-time proc-macro pulled only by argmin 0.11" },
]

[licenses]
# Every license in the dependency graph must be on this list. Adding one is a
# deliberate decision; note why in the PR that changes it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
